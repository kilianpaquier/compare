version: "2.0"

gitlab:
  controls:
    # Flags images using mutable tags (non-reproducible builds).
    containerImageMustNotUseForbiddenTags:
      enabled: true
      tags:
        - latest
        - dev
        - development
        - staging
        - main
        - master
        # - nightly
        # - edge
        # - canary
        # - unstable
      # Takes precedence over the tags list (e.g. alpine@sha256:...).
      containerImagesMustBePinnedByDigest: true

